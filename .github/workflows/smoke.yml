name: smoke

# Spec §12.1: ≤ 10-minute "install → first-chat-ready" SLO. Runs the full
# install.sh + agent-spawn + WS-upgrade path on a fresh Ubuntu 24.04 image
# and asserts the wall clock stays under the SLO ceiling.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  install-and-first-chat:
    name: install → first-chat-ready
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml is the single toolchain source; install.sh skips its
      # own rustup step when HAVN_SKIP_RUSTUP=1.
      - run: rustup toolchain install

      # Cache the cargo registry + git index + target/ so re-runs measure the
      # incremental build path (which is what the production SLO targets:
      # operators don't repeatedly download Rust). Cold runs still have to
      # finish under the SLO; the timeout-minutes guard above enforces it.
      - uses: Swatinem/rust-cache@v2

      - name: install jq
        run: sudo apt-get update -qq && sudo apt-get install -y jq

      - name: run smoke test
        run: ./scripts/smoke.sh
        env:
          # Use a debug build for CI — install.sh defaults to release, which
          # in cold-cache CI has historically pushed against the SLO ceiling.
          # Production keeps release.
          HAVN_PROFILE: debug
          HAVN_SKIP_RUSTUP: '1'
          # CI runners aren't root; skip the system-user creation.
          HAVN_SKIP_USER: '1'
          # GitHub-hosted runners disable unprivileged user namespaces, which
          # would otherwise make NamespaceSpawner fail at spawn time. Force
          # the subprocess fallback so the smoke validates the install path
          # rather than the kernel-isolation primitives (those are covered
          # by spawner unit tests and a separate `cargo test` job).
          HAVN_SPAWNER: subprocess
          HAVN_SMOKE_EXPECT_SPAWNER: subprocess

      - name: upload gateway log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-log
          path: ${{ runner.temp }}/havn-gateway.log
          if-no-files-found: ignore

  namespace-isolation:
    name: NamespaceSpawner isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: install jq
        run: sudo apt-get update -qq && sudo apt-get install -y jq
      - name: build
        run: cargo build --bins
      # Agents exec the runtime from inside a fresh user namespace where only
      # root is mapped, so the binaries must sit on a world-traversable path
      # (as install.sh arranges), not under the 0750 runner home.
      - name: install binaries
        run: |
          sudo install -m 0755 target/debug/havn target/debug/havn-gateway \
            target/debug/havn-runtime target/debug/havn-init /usr/local/bin/
      # The real NamespaceSpawner needs cgroup v2 write access, which on a
      # systemd host means running the gateway as root.
      - name: run smoke test as root with NamespaceSpawner
        run: |
          sudo env RUNNER_TEMP="$RUNNER_TEMP" \
            HAVN_SKIP_INSTALL=1 \
            HAVN_SMOKE_EXPECT_SPAWNER=namespace \
            ./scripts/smoke.sh
      # The misbehaving-agent tests run unprivileged in ci.yml; the one that
      # needs the agent's cgroup to identify it runs here, as root.
      - name: misbehaving agent under NamespaceSpawner
        run: |
          exe="$(cargo test -p havn-gateway --test misbehaving_agent --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test and .target.name == "misbehaving_agent") | .executable')"
          [ -x "$exe" ] || { echo "::error::misbehaving_agent test binary not found"; exit 1; }
          sudo "$exe" --ignored --test-threads=1 --nocapture
      - name: upload gateway log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-log-namespace
          path: ${{ runner.temp }}/havn-gateway.log
          if-no-files-found: ignore

  readme-deploy:
    # Install, set up and start havn and the dashboard with the commands in
    # README.md (building this checkout instead of downloading a release),
    # then chat with an agent through the dashboard in a headless browser.
    # A mock provider stands in for the LLM API: CI has no key.
    name: README deployment → dashboard chat
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_VERSION: 1.64.1
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: install Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save --no-package-lock \
            --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps --only-shell chromium
      - name: deploy as README.md says, then chat through the dashboard
        run: ./scripts/readme-deploy.sh
        env:
          # Debug build for CI time, as in the smoke job; the README's
          # commands are otherwise followed as written.
          HAVN_PROFILE: debug
          HAVN_SKIP_RUSTUP: '1'
          PLAYWRIGHT_DIR: ${{ runner.temp }}/playwright
      - name: upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: readme-deploy-logs
          path: |
            ${{ runner.temp }}/readme-gateway.log
            ${{ runner.temp }}/readme-dashboard.log
            ${{ runner.temp }}/dashboard-chat.png
          if-no-files-found: ignore
