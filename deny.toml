# cargo-deny configuration. https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
yanked = "warn"
ignore = [
    # paste is unmaintained but has no replacement; transitive dep via rmcp.
    "RUSTSEC-2024-0436",
    # proc-macro-error2 is unmaintained with no safe upgrade (RUSTSEC-2026-0173);
    # pulled in transitively via age -> i18n-embed-fl. Re-evaluate when age drops it.
    "RUSTSEC-2026-0173",
    # basic-toml is unmaintained with no safe upgrade (RUSTSEC-2026-0374); pulled in
    # transitively via age -> i18n-embed-fl -> i18n-config at proc-macro time only.
    # Re-evaluate when age drops i18n-embed-fl.
    "RUSTSEC-2026-0374",
    # rmcp < 3.9 buffers Streamable HTTP response bodies without a bound
    # (RUSTSEC-2026-0462). havn builds rmcp with default-features = false and only
    # client + transport-child-process + macros, so that transport is not compiled.
    # Remove when rmcp is upgraded to >= 3.9.
    "RUSTSEC-2026-0462",
    # Bundled SQLite in libsqlite3-sys < 0.39 (RUSTSEC-2026-0459, CVE-2026-119375).
    # Both sqlx 0.8 and 0.9 cap libsqlite3-sys below 0.39, so no upgrade path exists
    # yet. Tracked in a repository security advisory; remove once sqlx allows
    # libsqlite3-sys >= 0.39.
    "RUSTSEC-2026-0459",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "NCSA",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
